name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web app · validate & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dev dependencies
        run: npm ci --no-audit --no-fund

      - name: Generated data is up to date
        run: npm run check:data

      - name: Regenerate icons
        # byte-identical output depends on the local zlib build, so a diff is
        # reported as a warning: run `npm run build:icons` and commit if it fires
        continue-on-error: true
        run: |
          npm run build:icons
          git --no-pager diff --stat -- icons android/app/src/main/res

      - name: Validate markup, manifest and assets
        run: npm run validate

      - name: Unit + DOM tests
        run: npm test

      - name: Android assets are in sync
        run: node scripts/sync-android.js --check

  android:
    name: Android · assembleDebug
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: n-calc-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
