<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>N-Calc · Converter</title>
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Convert 161 currencies and dozens of units — offline friendly, part of N-Calc." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/converters.css" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('ncalc.theme');
          var mode = raw ? JSON.parse(raw) : localStorage.getItem('theme');
          if (mode !== 'dark' && mode !== 'light') mode = 'system';
          var dark =
            mode === 'system'
              ? !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches
              : mode === 'dark';
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (err) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try {
          /* 'auto' follows the device, anything else is a manual choice */
          var rawLayout = localStorage.getItem('ncalc.layout');
          var layout = rawLayout ? JSON.parse(rawLayout) : 'auto';
          if (layout !== 'portrait' && layout !== 'landscape') layout = 'auto';
          var landscape = !window.matchMedia || window.matchMedia('(orientation: landscape)').matches;
          document.documentElement.setAttribute(
            'data-layout',
            layout === 'auto' ? (landscape ? 'landscape' : 'portrait') : layout,
          );
          document.documentElement.setAttribute('data-layout-mode', layout);
        } catch (err) {
          document.documentElement.setAttribute('data-layout', 'portrait');
          document.documentElement.setAttribute('data-layout-mode', 'auto');
        }
      })();
    </script>
  </head>
  <body>
    <div class="backdrop" id="backdrop"></div>

    <main class="app" id="app">
      <header class="page-head">
        <button class="back-btn" id="back-btn" type="button" aria-label="Back to calculator">
          <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="15 18 9 12 15 6" /></svg>
        </button>
        <div class="page-titles">
          <div class="page-title">Converter</div>
          <div class="page-sub" id="page-sub">Currency</div>
        </div>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12zm0-16v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
          </svg>
        </button>
      </header>

      <div class="tabs-wrap">
        <div class="tabs" id="tabs" role="tablist"></div>
      </div>

      <section class="conv-body">
        <div class="value-card">
          <div class="value-row">
            <div class="value-block">
              <div class="value-label">Input <span class="value-unit" id="input-unit"></span></div>
              <div class="value-text" id="input-value">1</div>
            </div>
            <div class="value-divider"></div>
            <div class="value-block right">
              <div class="value-label">Result <span class="value-unit" id="result-unit"></span></div>
              <div class="value-text result" id="result-value" title="Tap to copy">–</div>
            </div>
          </div>
        </div>

        <div class="rate-note" id="rate-note" hidden>
          <span class="rate-text" id="rate-text">Loading rates…</span>
          <button class="rate-refresh" id="rate-refresh" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-3-6.7M21 3v5h-5" />
            </svg>
            Refresh
          </button>
        </div>

        <div class="selectors">
          <button class="selector" id="from-btn" type="button">
            <span class="selector-flag" id="from-flag">🇺🇸</span>
            <span class="selector-info">
              <span class="selector-code" id="from-code">USD</span>
              <span class="selector-name" id="from-name">US Dollar</span>
            </span>
            <span class="selector-chevron">▾</span>
          </button>

          <button class="swap-btn" id="swap-btn" type="button" aria-label="Swap units">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 20V6M7 6L3 10M7 6l4 4" />
              <path d="M17 4v14M17 18l4-4M17 18l-4-4" />
            </svg>
          </button>

          <button class="selector" id="to-btn" type="button">
            <span class="selector-flag" id="to-flag">🇪🇺</span>
            <span class="selector-info">
              <span class="selector-code" id="to-code">EUR</span>
              <span class="selector-name" id="to-name">Euro</span>
            </span>
            <span class="selector-chevron">▾</span>
          </button>
        </div>
      </section>

      <div class="conv-keypad">
        <button class="key key-num" data-action="digit" data-value="1" type="button">1</button>
        <button class="key key-num" data-action="digit" data-value="2" type="button">2</button>
        <button class="key key-num" data-action="digit" data-value="3" type="button">3</button>
        <button class="key key-fn key-ac" data-action="clear" type="button">AC</button>

        <button class="key key-num" data-action="digit" data-value="4" type="button">4</button>
        <button class="key key-num" data-action="digit" data-value="5" type="button">5</button>
        <button class="key key-num" data-action="digit" data-value="6" type="button">6</button>
        <button class="key key-fn" data-action="backspace" type="button" aria-label="Backspace">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 5H8.5L3 12l5.5 7H21a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z" />
            <path d="M12.5 9.5l5 5M17.5 9.5l-5 5" />
          </svg>
        </button>

        <button class="key key-num" data-action="digit" data-value="7" type="button">7</button>
        <button class="key key-num" data-action="digit" data-value="8" type="button">8</button>
        <button class="key key-num" data-action="digit" data-value="9" type="button">9</button>
        <button class="key key-fn" data-action="sign" type="button">+/−</button>

        <button class="key key-fn" data-action="decimal" type="button">.</button>
        <button class="key key-num" data-action="digit" data-value="0" type="button">0</button>
        <button class="key key-fn" data-action="double-zero" type="button">00</button>
        <button class="key key-eq" data-action="copy" type="button" aria-label="Copy result">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2.5" />
            <path d="M15 6.5V5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14h1" />
          </svg>
        </button>
      </div>
    </main>

    <!-- unit / currency picker -->
    <section class="sheet" id="picker-sheet" aria-hidden="true" aria-label="Select unit">
      <div class="sheet-handle"></div>
      <header class="sheet-header">
        <span class="sheet-title" id="picker-title">Select currency</span>
        <button class="chip chip--ghost" id="picker-close" type="button">Close</button>
      </header>
      <div class="picker-search-wrap" id="picker-search-wrap">
        <svg class="picker-search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
        </svg>
        <input
          class="picker-search"
          id="picker-search"
          type="text"
          placeholder="Search…"
          autocomplete="off"
          spellcheck="false"
          aria-label="Search units"
        />
      </div>
      <div class="sheet-body" id="picker-list"></div>
    </section>

    <noscript>
      <div class="empty-state">N-Calc needs JavaScript to run.</div>
    </noscript>

    <script src="math.js"></script>
    <script src="js/version.js"></script>
    <script src="js/engine.js"></script>
    <script src="js/units-data.js"></script>
    <script src="js/units.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/converters.js"></script>
  </body>
</html>
